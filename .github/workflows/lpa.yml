name: Las Palmas
on:
  push:
    branches: [lpa]
  pull_request:
    branches: [lpa]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: lpa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adaptation:
    runs-on: ubuntu-latest
    env:
      TZ: Atlantic/Canary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: pip install -r lpa/requirements.txt
      - run: python3 -m unittest discover -s tests -b
        env:
          TZ: Europe/Madrid
      - run: python3 -m unittest discover -s lpa/tests -v
      - run: python3 -m lpa.build /tmp/meteo-lpa
      - run: for file in /tmp/meteo-lpa/*.js; do node --check "$file"; done
      - name: Browser and accessibility dependencies
        if: github.event_name != 'schedule'
        run: |
          npm install --prefix /tmp/lpa-browser --no-save --package-lock=false playwright@1.62.1 axe-core@4.14.0
          /tmp/lpa-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility checks
        if: github.event_name != 'schedule'
        env:
          NODE_PATH: /tmp/lpa-browser/node_modules
        run: |
          python3 -m lpa.tests.fixture /tmp/meteo-lpa/montflorit.json
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/meteo-lpa >/tmp/lpa-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node lpa/tests/browser.cjs
      - uses: actions/upload-artifact@v6
        if: always() && github.event_name != 'schedule'
        with:
          name: lpa-browser-screenshots
          path: /tmp/lpa-screenshots
          if-no-files-found: ignore

  build-pages:
    needs: adaptation
    if: github.ref == 'refs/heads/lpa' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      TZ: Atlantic/Canary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r lpa/requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Generate production website
        run: python3 -m lpa.build _site
      - name: Restore persistent observation history
        id: history_restore
        run: ./lpa/data-branch.sh prepare "$RUNNER_TEMP/lpa-history"
      - name: Collect live weather data
        # A failed forecast must not overwrite the last working deployment.
        # The frontend hides that deployment's data when they become stale.
        run: python3 -m lpa.collect _site/montflorit.json --state-dir "$RUNNER_TEMP/lpa-history"
      - name: Persist observation history
        if: always() && steps.history_restore.outcome == 'success' && hashFiles('_site/montflorit.json') != ''
        run: ./lpa/data-branch.sh save "$RUNNER_TEMP/lpa-history"
      - name: Upload production website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy-pages:
    needs: build-pages
    if: github.ref == 'refs/heads/lpa' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
