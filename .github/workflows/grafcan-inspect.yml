name: Inspect GRAFCAN API
on:
  push:
    branches: [lpa]
    paths: [lpa/inspect-grafcan.py, .github/workflows/grafcan-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 lpa/inspect-grafcan.py
        env:
          GRAFCAN_API_KEY: ${{ secrets.GRAFCAN_API_KEY }}
